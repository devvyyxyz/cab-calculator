<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect With Us</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        .social-links-section {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 80px 20px;
        }
        .social-background {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }
        .social-background::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('https://images.unsplash.com/photo-1557683316-973673baf926?w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            animation: slowZoom 20s ease-in-out infinite alternate;
        }
        .social-background::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1;
        }
        @keyframes slowZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }
        .social-content {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            width: 100%;
            text-align: center;
        }
        .social-header { margin-bottom: 60px; }
        .social-title {
            font-size: 2.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #ffffff;
            margin-bottom: 16px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .social-subtitle {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.85);
        }
        .social-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            max-width: 900px;
            margin: 0 auto;
        }
        .social-card {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-decoration: none;
            transition: all 0.3s ease;
            overflow: hidden;
        }
        .social-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .social-icon-wrapper {
            width: 80px; height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            border-radius: 50%;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        .social-card:hover .social-icon-wrapper {
            background: #e8e8e8;
            transform: scale(1.1);
        }
        .social-icon {
            width: 40px; height: 40px;
            transition: transform 0.3s ease;
        }
        .social-card:hover .social-icon {
            transform: scale(1.15);
        }
        .social-name {
            font-size: 0.875rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #333;
        }
        .social-accent {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%;
            height: 4px;
            transition: height 0.3s ease;
        }
        .social-card:hover .social-accent {
            height: 6px;
        }
        .social-card.discord .social-accent { background: #5865F2; }
        .social-card.youtube .social-accent { background: #FF0000; }
        .social-card.roblox .social-accent { background: #000000; }
        .social-card.twitter .social-accent { background: #1DA1F2; }
        @media (min-width: 768px) {
            .social-title { font-size: 3rem; }
            .social-subtitle { font-size: 1.125rem; }
            .social-grid { grid-template-columns: repeat(4, 1fr); gap: 32px; }
            .social-card { padding: 48px 24px; }
            .social-icon-wrapper { width: 96px; height: 96px; }
            .social-icon { width: 48px; height: 48px; }
            .social-name { font-size: 1rem; }
        }
        @media (min-width: 1024px) {
            .social-links-section { padding: 100px 40px; }
            .social-title { font-size: 3.5rem; }
        }
    </style>
</head>
