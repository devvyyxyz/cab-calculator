<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Grid Layout</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #3b82f6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      max-width: 960px;
      margin: 0 auto;
    }

    @media (max-width: 640px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #e0f2fe, #bfdbfe);
      border: 1px solid #bae6fd;
      display: grid;
      place-items: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .name {
      font-weight: 700;
      font-size: 16px;
      line-height: 1.2;
    }

    .stats {
      display: flex;
      gap: 16px;
      flex: 1;
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .stat strong {
      color: var(--text);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="grid">
    <div class="card">
      <div class="row">
        <div class="icon">🧪</div>
        <div class="name">Brainrot A</div>
      </div>
      <div class="row">
        <div class="icon">🧪</div>
        <div class="stats">
          <div class="stat">Health: <strong>120</strong></div>
          <div class="stat">Level: <strong>45</strong></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <div class="icon">🧬</div>
        <div class="name">Brainrot B</div>
      </div>
      <div class="row">
        <div class="icon">🧬</div>
        <div class="stats">
          <div class="stat">Health: <strong>95</strong></div>
          <div class="stat">Level: <strong>32</strong></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <div class="icon">⚗️</div>
        <div class="name">Brainrot C</div>
      </div>
      <div class="row">
        <div class="icon">⚗️</div>
        <div class="stats">
          <div class="stat">Health: <strong>140</strong></div>
          <div class="stat">Level: <strong>50</strong></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <div class="icon">🧫</div>
        <div class="name">Brainrot D</div>
      </div>
      <div class="row">
        <div class="icon">🧫</div>
        <div class="stats">
          <div class="stat">Health: <strong>110</strong></div>
          <div class="stat">Level: <strong>28</strong></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <div class="icon">🔮</div>
        <div class="name">Brainrot E</div>
      </div>
      <div class="row">
        <div class="icon">🔮</div>
        <div class="stats">
          <div class="stat">Health: <strong>130</strong></div>
          <div class="stat">Level: <strong>41</strong></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <div class="icon">🧪</div>
        <div class="name">Brainrot F</div>
      </div>
      <div class="row">
        <div class="icon">🧪</div>
        <div class="stats">
          <div class="stat">Health: <strong>100</strong></div>
          <div class="stat">Level: <strong>37</strong></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
